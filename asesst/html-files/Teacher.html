<!doctype html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atomic-school</title>
    <link rel="stylesheet" href="../styles/reset.css" />
    <link rel="stylesheet" href="../styles/styles.css" />
    <link rel="stylesheet" href="../styles/Teachers.css" />
    <style>
      /* استایل کمکی برای پیام خطا */
      .error-msg {
        color: red;
        font-size: 0.8rem;
        margin-top: 5px;
        text-align: center;
      }
      /* مخفی کردن بخش‌های اصلی تا زمانی که کد درست وارد شود */
      #TeacherWelcome-box,
      #TeacherAbility-box,
      #TeacherMadeHomework-box,
      #TeacherMadeHomeworkList-box,
      #TeacherSubmissions-container {
        display: none;
      }
    </style>
  </head>
  <body>
    <!------------------  Header  ------------------>
    <header class="Header">
      <h2 class="navbar-title">مدرسه انرژی اتمی ⚛️</h2>
      <nav class="navbar">
        <a href="../../index.html" class="navbar-item" data-title="کد ها">
          <img
            src="../imges/code-solid-full.svg"
            alt="code"
            class="header-img"
          />
        </a>
        <a href="./AbouteWe.html" data-title="درباره ما" class="navbar-item">
          <img
            src="../imges/user-solid-full.svg"
            alt="user"
            class="header-img"
          />
        </a>
        <a href="./call.html" data-title="ارتباط با ما" class="navbar-item">
          <img
            src="../imges/phone-solid-full.svg"
            alt="phone"
            class="header-img"
          />
        </a>
        <a href="./homework.html" data-title="تکالیف" class="navbar-item">
          <img
            src="../imges/arrow-up-from-bracket-solid-full.svg"
            alt="homework"
            class="header-img"
          />
        </a>
        <a
          href="./Teacher.html"
          data-title="ورود معلم"
          class="navbar-item header-active-img"
        >
          <img
            src="../imges/right-to-bracket-solid-full.svg"
            alt="login"
            class="header-img"
          />
        </a>
      </nav>
    </header>

    <main>
      <!-- بخش ورود با رمز -->
      <div class="Teacherpassword-box" id="Teacherpassword-box">
        <h2 class="TeacherPassword-title">🔐 دسترسی مدیریت</h2>
        <p class="TeacherPassword-text">برای ورود کد 5 رقمی را وارد کنید</p>
        <label for="Password" class="TeacherPassword-label">کد ورود</label>
        <input
          type="password"
          id="Password"
          class="TeacherPassword-input"
          placeholder="00000"
        />
        <p
          id="error-msg"
          class="error-msg"
          style="color: red; margin-top: 5px"
        ></p>
        <button type="button" class="TeacherPassword-btn" onclick="checkCode()">
          ورود به پنل
        </button>
      </div>

      <!-- بخش خوش‌آمدگویی -->
      <div
        class="TeacherWelcome-box"
        id="TeacherWelcome-box"
        style="display: none"
      >
        <p class="TeacherWelcome-UpTitle">مدیریت کلاس</p>
        <h2 class="TeacherWelcome-title">پنل استاد</h2>
        <p class="TeacherWelcome-text">آموزش‌ها و تکالیف کلاس را مدیریت کن.</p>
        <!-- دکمه خروج -->
        <button
          type="button"
          class="Logout-btn"
          onclick="logout()"
          style="
            margin-top: 10px;
            background: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
          "
        >
          خروج از حساب
        </button>
      </div>

      <!-- بخش دکمه‌های عملیاتی -->
      <div
        class="TeacherAbility-box"
        id="TeacherAbility-box"
        style="
          display: none;
          gap: 10px;
          flex-wrap: wrap;
          justify-content: center;
          margin: 20px 0;
        "
      >
        <button
          type="button"
          class="TeacherAbility-btn1"
          onclick="showSection('TeacherMadeHomework-box')"
        >
          افزودن تکلیف
        </button>
        <button
          type="button"
          class="TeacherAbility-btn2"
          onclick="showSection('TeacherMadeHomeworkList-box')"
        >
          لیست تکالیف من
        </button>
        <button
          type="button"
          class="TeacherAbility-btn2"
          onclick="showSection('TeacherSubmissions-container')"
        >
          ارسال های دانش آموزان
        </button>
      </div>

      <!-- بخش ساخت تکلیف -->
      <div
        class="TeacherMadeHomework-box panel-section"
        id="TeacherMadeHomework-box"
        style="display: none"
      >
        <h2 class="TeacherMadeHomework-title">ساخت تکلیف جدید</h2>

        <label for="hw-title-input" class="TeacherMadeHomework-lebel"
          >عنوان تکلیف</label
        >
        <input
          type="text"
          id="hw-title-input"
          class="TeacherMadeHomework-input"
        />

        <label for="hw-desc-input" class="TeacherMadeHomework-lebel"
          >توضیحات تکلیف</label
        >
        <textarea
          id="hw-desc-input"
          rows="5"
          class="TeacherMadeHomework-textarea"
        ></textarea>

        <button
          type="button"
          class="TeacherMadeHomework-btn"
          onclick="publishHomework()"
        >
          انتشار تکلیف
        </button>
      </div>

      <!-- بخش لیست تکالیف منتشر شده توسط معلم -->
      <div
        class="TeacherMadeHomeworkList-container panel-section"
        id="TeacherMadeHomeworkList-box"
        style="display: none; max-width: 600px; margin: 0 auto; padding: 20px"
      >
        <h2 class="TeacherMadeHomework-title">تکالیف منتشر شده توسط شما</h2>
        <div id="teacher-homeworks-list"></div>
      </div>

      <!-- بخش تسلیم‌های دانش‌آموزان -->
      <div
        class="TeacherSubmissions-container panel-section"
        id="TeacherSubmissions-container"
        style="display: none; max-width: 650px; margin: 0 auto; padding: 20px"
      >
        <h2
          class="TeacherSubmissions-title"
          style="margin-bottom: 20px; text-align: center"
        >
          ارسال‌های دانش‌آموزان
        </h2>
        <!-- آیتم‌ها به صورت داینامیک از لوکال استوریج لود می‌شوند -->
        <div id="teacher-submissions-list"></div>
      </div>
    </main>

    <script src="../config.js"></script>
    <script>
      // بررسی وضعیت ورود به محض بارگذاری صفحه
      window.onload = function () {
        if (localStorage.getItem("teacherToken")) {
          showPanel();
        }
      };

      async function checkCode() {
        const passwordInput = document.getElementById("Password");
        const errorMsg = document.getElementById("error-msg");
        errorMsg.textContent = "";

        try {
          const res = await fetch(`${API_BASE}/auth/teacher-login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ pin: passwordInput.value }),
          });
          const data = await res.json();

          if (!res.ok) {
            errorMsg.textContent = data.error || "کد وارد شده اشتباه است!";
            passwordInput.value = "";
            return;
          }

          localStorage.setItem("teacherToken", data.token);
          showPanel();
        } catch (err) {
          errorMsg.textContent =
            "ارتباط با سرور برقرار نشد. مطمئن شوید بک‌اند روشن است.";
        }
      }

      // هدر احراز هویت برای درخواست‌های محافظت‌شده
      function authHeaders() {
        return {
          "Content-Type": "application/json",
          Authorization: `Bearer ${localStorage.getItem("teacherToken")}`,
        };
      }

      function showPanel() {
        document.getElementById("Teacherpassword-box").style.display = "none";
        document.getElementById("TeacherWelcome-box").style.display = "block";
        document.getElementById("TeacherAbility-box").style.display = "flex";
        showSection("TeacherMadeHomework-box");
      }

      // تابع جابجایی بین بخش‌ها
      function showSection(sectionId) {
        const sections = document.querySelectorAll(".panel-section");
        sections.forEach((sec) => {
          sec.style.display = "none";
        });

        const target = document.getElementById(sectionId);
        if (target) {
          target.style.display = "block";
        }

        // اگر بخش لیست تکالیف معلم بود، آن را به‌روز کن
        if (sectionId === "TeacherMadeHomeworkList-box") {
          loadTeacherHomeworksList();
        }

        // اگر بخش ارسال‌های دانش‌آموزان بود، لیست را به‌روز کن
        if (sectionId === "TeacherSubmissions-container") {
          loadSubmissionsToTeacherPanel();
        }
      }

      // تابع انتشار تکلیف توسط معلم
      async function publishHomework() {
        const titleInput = document.getElementById("hw-title-input");
        const descInput = document.getElementById("hw-desc-input");

        if (!titleInput.value || !descInput.value) {
          alert("لطفاً عنوان و توضیحات تکلیف را وارد کنید!");
          return;
        }

        try {
          const res = await fetch(`${API_BASE}/homework`, {
            method: "POST",
            headers: authHeaders(),
            body: JSON.stringify({
              title: titleInput.value,
              description: descInput.value,
            }),
          });
          const data = await res.json();
          if (!res.ok) {
            alert(data.error || "خطا در انتشار تکلیف");
            return;
          }

          alert("تکلیف با موفقیت منتشر شد!");
          titleInput.value = "";
          descInput.value = "";
        } catch (err) {
          alert("ارتباط با سرور برقرار نشد.");
        }
      }

      // تابع بارگذاری تکالیف ساخته شده توسط معلم در پنل خودش
      async function loadTeacherHomeworksList() {
        const container = document.getElementById("teacher-homeworks-list");
        container.innerHTML =
          '<p style="text-align:center; padding:20px; color:gray;">در حال بارگذاری...</p>';

        let homeworks = [];
        try {
          const res = await fetch(`${API_BASE}/homework`);
          const data = await res.json();
          homeworks = data.homeworks || [];
        } catch (err) {
          container.innerHTML =
            '<p style="text-align:center; padding:20px; color:red;">ارتباط با سرور برقرار نشد.</p>';
          return;
        }

        if (homeworks.length === 0) {
          container.innerHTML =
            '<p style="text-align:center; padding: 20px; color: gray;">هنوز تکلیفی منتشر نکرده‌اید.</p>';
          return;
        }

        let html = "";
        homeworks.forEach((hw) => {
          const dateLabel = new Date(hw.created_at).toLocaleDateString("fa-IR");
          html += `
            <div style="background: #f9f9f9; border: 1px solid #ddd; padding: 15px; margin-bottom: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.03);">
              <div style="padding-left: 10px;">
                <h4 style="margin: 0 0 6px 0; color: #2c3e50; font-size: 1.05rem;">${hw.title}</h4>
                <p style="margin: 0 0 6px 0; color: #555; font-size: 0.95rem; line-height: 1.5;">${hw.description || ""}</p>
                <small style="color: #888; font-size: 0.8rem;">تاریخ انتشار: ${dateLabel}</small>
              </div>
              <button onclick="deleteTeacherHomework(${hw.id})" style="background: #e74c3c; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; height: fit-content; font-size: 0.9rem; transition: background 0.2s;">حذف</button>
            </div>
          `;
        });

        container.innerHTML = html;
      }

      // تابع حذف تکلیف منتشر شده توسط معلم
      window.deleteTeacherHomework = async function (id) {
        if (!confirm("آیا از حذف این تکلیف مطمئن هستید؟")) return;
        try {
          const res = await fetch(`${API_BASE}/homework/${id}`, {
            method: "DELETE",
            headers: authHeaders(),
          });
          if (!res.ok) {
            const data = await res.json();
            alert(data.error || "خطا در حذف تکلیف");
            return;
          }
          loadTeacherHomeworksList();
        } catch (err) {
          alert("ارتباط با سرور برقرار نشد.");
        }
      };

      // تابع بارگذاری ارسال‌های دانش‌آموزان در پنل معلم با استایل استاندارد و فاصله دار
      async function loadSubmissionsToTeacherPanel() {
        const container = document.getElementById("teacher-submissions-list");
        container.innerHTML =
          '<p style="text-align:center; padding:20px; color:gray;">در حال بارگذاری...</p>';

        let submissions = [];
        try {
          const res = await fetch(`${API_BASE}/submissions`, {
            headers: authHeaders(),
          });
          const data = await res.json();
          if (!res.ok) {
            container.innerHTML = `<p style="text-align:center; padding:20px; color:red;">${data.error || "خطا در دریافت ارسال‌ها"}</p>`;
            return;
          }
          submissions = data.submissions || [];
        } catch (err) {
          container.innerHTML =
            '<p style="text-align:center; padding:20px; color:red;">ارتباط با سرور برقرار نشد.</p>';
          return;
        }

        if (submissions.length === 0) {
          container.innerHTML =
            '<p style="text-align:center; padding: 30px; color: gray; font-size: 0.95rem;">هنوز ارسالی از طرف دانش‌آموزان ثبت نشده است.</p>';
          return;
        }

        let htmlContent = "";

        submissions.forEach((sub) => {
          const dateLabel = new Date(sub.created_at).toLocaleDateString(
            "fa-IR",
          );
          const gradeLabel =
            sub.grade != null ? `نمره: ${sub.grade}` : "هنوز نمره داده نشده";
          htmlContent += `
            <div class="TeacherSubmissions-item" style="background: #ffffff; border: 1px solid #e0e0e0; padding: 18px 20px; margin-bottom: 14px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.04); flex-wrap: wrap; gap: 10px;">
              <div class="Submission-info" style="padding-left: 15px;">
                <span class="Student-name" style="display: block; font-weight: bold; font-size: 1.05rem; color: #2c3e50; margin-bottom: 4px;">${sub.first_name} ${sub.last_name}</span>
                <span class="Homework-name" style="display: block; font-size: 0.9rem; color: #2980b9; margin-bottom: 6px;">تکلیف: ${sub.homework_title || "نامشخص"}</span>
                <a href="${sub.aparat_link}" target="_blank" style="display: inline-block; color: #3498db; text-decoration: none; font-size: 0.9rem; margin-bottom: 6px; font-weight: 500;">🔗 مشاهده ویدیو در آپارات</a>
                <span class="Submission-date" style="display: block; font-size: 0.75rem; color: #888;">تاریخ ارسال: ${dateLabel} — ${gradeLabel}</span>
              </div>
              <div class="Submission-actions" style="display: flex; gap: 8px; align-items: center; min-width: fit-content;">
                <button class="Grade-btn" onclick="gradeSubmission(${sub.id})" style="background: #27ae60; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 0.9rem;">ثبت نمره</button>
                <button class="Delete-btn" onclick="deleteSubmission(${sub.id})" style="background: #e74c3c; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 0.9rem;">حذف</button>
              </div>
            </div>
          `;
        });

        container.innerHTML = htmlContent;
      }

      // تابع ثبت نمره و بازخورد برای یک ارسال
      async function gradeSubmission(id) {
        const grade = prompt("نمره را وارد کنید (مثلاً 18.5):");
        if (grade === null) return;
        const feedback = prompt("بازخورد (اختیاری):") || "";

        try {
          const res = await fetch(`${API_BASE}/submissions/${id}`, {
            method: "PATCH",
            headers: authHeaders(),
            body: JSON.stringify({ grade: Number(grade), feedback }),
          });
          const data = await res.json();
          if (!res.ok) {
            alert(data.error || "خطا در ثبت نمره");
            return;
          }
          loadSubmissionsToTeacherPanel();
        } catch (err) {
          alert("ارتباط با سرور برقرار نشد.");
        }
      }

      // تابع حذف ارسال دانش‌آموز توسط معلم
      async function deleteSubmission(id) {
        if (!confirm("آیا از حذف این ارسال مطمئن هستید؟")) return;
        try {
          const res = await fetch(`${API_BASE}/submissions/${id}`, {
            method: "DELETE",
            headers: authHeaders(),
          });
          if (!res.ok) {
            const data = await res.json();
            alert(data.error || "خطا در حذف ارسال");
            return;
          }
          loadSubmissionsToTeacherPanel();
        } catch (err) {
          alert("ارتباط با سرور برقرار نشد.");
        }
      }

      // خروج از حساب
      function logout() {
        localStorage.removeItem("teacherToken");
        location.reload();
      }
    </script>
  </body>
</html>
